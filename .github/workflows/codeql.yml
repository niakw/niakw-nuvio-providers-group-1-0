name: "SEC - CodeQL"

# Advanced CodeQL configuration for NiakVIO.
#
# Deliberately no "push" trigger: rapid commits on main must not spawn CodeQL
# runs that compete with runtime/publication workflows. Pull requests are scanned,
# a full audit is kept weekly, and maintainers can launch a scan manually.
#
# IMPORTANT: GitHub CodeQL Default Setup must be disabled in repository settings.
# Default Setup overrides Advanced Setup and blocks uploads from this workflow.

on:
  pull_request:
    branches:
      - main
    paths:
      # GitHub Actions / security configuration
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"

      # JavaScript / TypeScript
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"

      # Python
      - "**/*.py"

      # Dependency manifests / lockfiles
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "requirements*.txt"
      - "pyproject.toml"
      - "poetry.lock"
      - "Pipfile"
      - "Pipfile.lock"

  schedule:
    # Weekly security audit, Saturday 18:42 UTC.
    - cron: "42 18 * * 6"

  workflow_dispatch:

# One CodeQL workflow run at a time for the entire repository. A newer PR/manual/
# scheduled run supersedes an older one instead of building a queue.
concurrency:
  group: niakvio-codeql
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    # A single matrix keeps one immutable init/analyze action pair in the workflow,
    # while JavaScript/TypeScript is split into bounded databases. The union of
    # source + providers + provider-bases still scans every JS/TS file with the
    # complete security-extended query suite.
    name: "${{ matrix.check_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: "CodeQL · actions"
            language: actions
            build_mode: none
            config: ""
            category: "/language:actions"
          - check_name: "CodeQL · python"
            language: python
            build_mode: none
            config: ""
            category: "/language:python"
          - check_name: "CodeQL · javascript-typescript · source"
            language: javascript-typescript
            build_mode: none
            config: |
              paths-ignore:
                - providers/**
                - provider-bases/**
            category: "/language:javascript-typescript/shard:source"
          - check_name: "CodeQL · javascript-typescript · providers"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - providers/**
            category: "/language:javascript-typescript/shard:providers"
          - check_name: "CodeQL · javascript-typescript · provider-bases"
            language: javascript-typescript
            build_mode: none
            config: |
              paths:
                - provider-bases/**
            category: "/language:javascript-typescript/shard:provider-bases"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended
          config: ${{ matrix.config }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: ${{ matrix.category }}

  javascript-result:
    # Preserve the historical required-check name. Because `analyze` is one matrix
    # job, this result becomes green only after Actions, Python and all three JS
    # shards have succeeded.
    name: "CodeQL · javascript-typescript"
    if: always()
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce complete CodeQL matrix
        env:
          MATRIX_RESULT: ${{ needs.analyze.result }}
        run: test "$MATRIX_RESULT" = "success"
