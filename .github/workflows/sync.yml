name: CORE - Verify & Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation depth
        required: true
        default: quick
        type: choice
        options: [quick, deep]
  pull_request:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'vf/manifest.json'
      - 'no-anime/manifest.json'
      - 'vf-no-anime/manifest.json'
      - 'providers/**'
      - 'provider-overrides.json'
      - 'provider_catalog.json'
      - 'provider-hubs.json'
      - 'provider-type-policy.json'
      - 'scripts/provider_patches/**'
      - 'scripts/provider_base_store.py'
      - 'scripts/provider_wings_runtime_common.py'
      - 'scripts/audit_provider_v3_static.py'
      - 'scripts/build_published_provider_stage.py'
      - 'scripts/build_observational_health_report.py'
      - 'scripts/health_check.mjs'
      - 'tests/**'
      - 'automation/provider-v3-architecture.json'
      - 'ARCHITECTURE.md'
      - 'ARCHITECTURE.docx'
      - 'README.md'
      - 'README.fr.md'
      - 'HEALTH-CHECK.md'
      - 'VALIDATION.md'
      - 'CONTRIBUTING.md'
      - 'INSTALL.md'
      - 'SECURITY.md'
      - 'UPSTREAMS.md'
      - 'engine_v2/README.md'
      - 'package.json'
      - 'scripts/provider_v3_minimizer.py'
      - 'scripts/gate_native_declared_provider_matrix.py'
      - 'scripts/run_native_corpus_tv_suite.sh'
      - 'scripts/run_native_corpus_mobile_suite.sh'
      - 'scripts/run_native_corpus_desktop_suite.sh'
      - 'scripts/native_player_diagnostics_codegen.py'
      - '.github/triggers/nuvio-client-lab.json'
      - '.github/workflows/native-mobile-android-reader.yml'
      - '.github/workflows/native-mobile-ios-reader.yml'
      - '.github/workflows/native-desktop-reader-acceptance.yml'
      - '.github/workflows/sync.yml'
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'vf/manifest.json'
      - 'no-anime/manifest.json'
      - 'vf-no-anime/manifest.json'
      - 'providers/**'
      - 'provider-overrides.json'
      - 'provider_catalog.json'
      - 'provider-hubs.json'
      - 'provider-type-policy.json'
      - 'scripts/provider_patches/**'
      - 'scripts/provider_base_store.py'
      - 'scripts/provider_wings_runtime_common.py'
      - 'scripts/audit_provider_v3_static.py'
      - 'tests/**'
      - 'automation/provider-v3-architecture.json'
      - 'ARCHITECTURE.md'
      - 'ARCHITECTURE.docx'
      - 'README.md'
      - 'README.fr.md'
      - 'HEALTH-CHECK.md'
      - 'VALIDATION.md'
      - 'CONTRIBUTING.md'
      - 'INSTALL.md'
      - 'SECURITY.md'
      - 'UPSTREAMS.md'
      - 'engine_v2/README.md'
      - 'package.json'
      - 'scripts/provider_v3_minimizer.py'
      - 'scripts/gate_native_declared_provider_matrix.py'
      - 'scripts/run_native_corpus_tv_suite.sh'
      - 'scripts/run_native_corpus_mobile_suite.sh'
      - 'scripts/run_native_corpus_desktop_suite.sh'
      - 'scripts/native_player_diagnostics_codegen.py'
      - '.github/triggers/nuvio-client-lab.json'
      - '.github/workflows/native-mobile-android-reader.yml'
      - '.github/workflows/native-mobile-ios-reader.yml'
      - '.github/workflows/native-desktop-reader-acceptance.yml'
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '47 4 * * 2,5'

permissions:
  contents: write

concurrency:
  group: provider-v3-core-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      # Repair/reconstruction PRs deliberately carry workspace-addressed bundles.
      # Every main/scheduled/direct verification remains strict publication mode.
      NUVIO_PROVIDER_V3_CONTEXT: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'workbench/') && 'workspace' || 'publication' }}
    steps:
      - name: Checkout exact validation ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Quick or Deep
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          MODE=quick
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=deep
          fi
          echo "validation_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "FIELD_PROVIDER_VERIFY_MODE mode=$MODE repair=false reconstruction=false"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Quick gate - exact published bytes and critical Core contracts
        run: |
          set -euo pipefail
          python tests/provider_v3_workflow_ownership_test.py
          python tests/provider_v3_documentation_contract_test.py
          python tests/native_five_lab_coverage_test.py
          python tests/native_lab_observational_purity_test.py
          python tests/native_ios_watchdog_resume_test.py
          python tests/native_declared_provider_matrix_test.py
          python tests/native_lab_reader_observation_contract_test.py
          python tests/provider_v3_minimizer_contract_test.py
          python tests/provider_v3_minimizer_published_test.py
          python tests/provider_html_filter_security_test.py --published
          python tests/provider_v3_strategy_plan_contract_test.py
          python tests/provider_wings_runtime_family_test.py
          python tests/peachify_runtime_crypto_test.py
          python scripts/audit_provider_v3_static.py
          python tests/provider_brick_portfolio_audit_test.py --published --require-all
          python tests/provider_521_capability_regression_test.py
          python tests/global_media_type_pre_network_gate_test.py
          python tests/global_media_type_resolution_test.py
          python tests/global_stream_presentation_test.py
          python tests/global_stream_presentation_pipeline_test.py
          python tests/global_stream_identity_test.py
          python tests/runtime_capability_media_safety_v4_test.py
          python tests/global_playback_integrity_policy_test.py
          python tests/stream_output_sanitizer_fail_closed_test.py
          git diff --exit-code

      - name: Deep gate - full structural contracts
        if: steps.mode.outputs.validation_mode == 'deep'
        run: |
          set -euo pipefail
          python tests/provider_clean_reconstruction_contract_test.py
          python tests/provider_base_layering_contract_test.py
          python tests/provider_wrapper_isolation_test.py
          python tests/provider_byte_stability_contract_test.py
          python tests/published_provider_lego_contract_test.py
          python tests/repository_hygiene_contract_test.py
          python tests/global_catalogue_alias_recovery_test.py
          python tests/global_core_presentation_pipeline_test.py
          python scripts/audit_provider_v3_static.py
          git diff --exit-code

      - name: Deep - build exact published-provider observation stage
        if: steps.mode.outputs.validation_mode == 'deep'
        run: python scripts/build_published_provider_stage.py --stage staging-published

      - name: Deep - read-only authoritative hub observation
        if: steps.mode.outputs.validation_mode == 'deep'
        run: |
          mkdir -p health-output
          python scripts/resolve_provider_hubs.py \
            --mode deep \
            --include-disabled \
            --workers 8 \
            --timeout 8 \
            --output health-output/provider-hub-report.json
          git diff --exit-code -- provider-overrides.json provider-domain-history.json providers provider-bases

      - name: Deep - observe all exact published providers
        if: steps.mode.outputs.validation_mode == 'deep'
        env:
          NUVIO_STAGE: staging-published
          NUVIO_CANDIDATES_PATH: staging-published/candidates.json
          NUVIO_HEALTH_OUTPUT: health-output
          NUVIO_HEALTH_RESULTS_FILENAME: health-results.json
          NUVIO_WORKER_MEMORY_MB: '1024'
        run: |
          set -euo pipefail
          node scripts/health_check.mjs --deep
          python scripts/build_observational_health_report.py \
            --results health-output/health-results.json \
            --manifest manifest.json \
            --output health-output/health-report.json
          python scripts/generate_diagnostics.py \
            --results health-output/health-results.json \
            --output health-output
          test -s health-output/health-report.json
          test -s health-output/diagnostics-report.json

      - name: Deep - reproject manifests and integrity inventories
        if: steps.mode.outputs.validation_mode == 'deep'
        run: |
          set -euo pipefail
          cp health-output/health-report.json health-report.json
          cp health-output/provider-hub-report.json provider-hub-report.json
          cp health-output/diagnostics-report.json diagnostics-report.json
          cp health-output/diagnostics-report.html diagnostics-report.html
          python scripts/generate_language_manifests.py --manifest manifest.json --report health-report.json
          python scripts/validate_language_projection.py
          python scripts/audit_provider_v3_static.py
          git diff --exit-code -- providers provider-bases provider-overrides.json provider_catalog.json provider-type-policy.json scripts/provider_patches
          python scripts/generate_release_hashes.py
          python scripts/validate_release_integrity.py

      - name: Deep - upload evidence
        if: steps.mode.outputs.validation_mode == 'deep'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: provider-v3-deep-${{ github.run_id }}
          path: |
            health-output/health-results.json
            health-output/health-report.json
            health-output/provider-hub-report.json
            health-output/diagnostics-report.json
            health-output/diagnostics-report.html
          retention-days: 8
          if-no-files-found: error

      - name: Deep - publish reports, manifests and hashes
        if: steps.mode.outputs.validation_mode == 'deep' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add \
            health-report.json \
            provider-hub-report.json \
            diagnostics-report.json \
            diagnostics-report.html \
            vf/manifest.json \
            no-anime/manifest.json \
            vf-no-anime/manifest.json \
            FILE-HASHES.json \
            PATCH-SHA256SUMS.txt \
            SHA256SUMS.json

          if git diff --cached --name-only | grep -Ev '^(health-report\.json|provider-hub-report\.json|diagnostics-report\.json|diagnostics-report\.html|FILE-HASHES\.json|PATCH-SHA256SUMS\.txt|SHA256SUMS\.json|vf/manifest\.json|no-anime/manifest\.json|vf-no-anime/manifest\.json)$'; then
            echo 'Deep staged a forbidden runtime/DATA path.' >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No Deep publication change.'
            exit 0
          fi

          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
            echo "FIELD_CORE_PUBLICATION_SKIPPED reason=main_advanced validated=$BASE_SHA current=$CURRENT_SHA"
            exit 0
          fi

          git commit -m 'chore: publish Provider v3 Deep verification'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
